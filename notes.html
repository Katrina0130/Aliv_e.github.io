<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>随笔 · 陈佳怡</title><link rel="stylesheet" href="style.css"></head><body><div class="site"><header class="top"><a class="brand" href="index.html">陈佳怡<span> / CJY</span></a><nav class="nav"><a href="index.html" data-zh="首页" data-en="Home">首页</a><a href="works.html" data-zh="内容" data-en="Work">内容</a><a href="gallery.html" data-zh="影像" data-en="Gallery">影像</a><a class="active" href="notes.html" data-zh="随笔" data-en="Notes">随笔</a></nav><button class="lang">EN</button></header><main><section class="page-top"><p class="kicker">03 / NOTES</p><h1 class="page-title" data-zh="一些阅读、<br><em>思考与记录。</em>" data-en="Reading, thinking,<br><em>and little notes.</em>">一些阅读、<br><em>思考与记录。</em></h1><p class="page-sub" data-zh="每一则随笔都可以是一篇短文、读书笔记、活动回顾或一个尚未想清楚的问题。" data-en="Every note can be a short essay, a reading reflection, an event recap, or a question still taking shape.">每一则随笔都可以是一篇短文、读书笔记、活动回顾或一个尚未想清楚的问题。</p></section><section class="writing-list"><article class="post"><time>2026. --</time><h2 data-zh="待填写：第一篇随笔标题" data-en="To add: First note title">待填写：第一篇随笔标题</h2><p data-zh="待填写：用一两句话写下这篇内容的概要或你想记住的一个观点。" data-en="To be added: A one- or two-sentence description, or the thought you want to keep.">待填写：用一两句话写下这篇内容的概要或你想记住的一个观点。</p></article><article class="post"><time>2026. --</time><h2 data-zh="待填写：第二篇随笔标题" data-en="To add: Second note title">待填写：第二篇随笔标题</h2><p data-zh="待填写：可以是语言学习、校园生活、阅读或观察。" data-en="To be added: It could be about language learning, campus life, reading, or an observation.">待填写：可以是语言学习、校园生活、阅读或观察。</p></article><article class="post"><time>2026. --</time><h2 data-zh="待填写：第三篇随笔标题" data-en="To add: Third note title">待填写：第三篇随笔标题</h2><p data-zh="待填写：等你想分享新的内容时，再将它补充进来。" data-en="To be added: Add it whenever there is something new you want to share.">待填写：等你想分享新的内容时，再将它补充进来。</p></article></section></main><footer class="footer"><span>© 2026
